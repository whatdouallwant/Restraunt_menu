{% extends 'base.html' %}
{% block content %}

<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" 
  style="width: 1300px; margin: auto; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; padding: 10px;">
      <div class="container-fluid">
      <a class="navbar-brand">Sol-sol!</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
        </li>
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'cart' %}">Cart</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}">Logout</a>
          </li>
          {% endif %}
        {% if not user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'register' %}">Register</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
</nav>

<div class="container mt-4" style="margin-top: 500px; position: relative; max-width: 600px; background-color: rgb(54, 164, 255); padding: 20px; border-radius: 10px; height: 400px;">
    <h2>Оформлення замовлення</h2>
    <form method="post" action="{% url 'order' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="address" class="form-label">Адреса доставки</label>
            <input type="text" class="form-control" id="address" name="address" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Телефонний номер</label>
            <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="mb-3">
            <label for="payment" class="form-label">Спосіб оплати</label>
            <select class="form-select" id="payment" name="payment" required>
                <option value="card">Оплата карткою</option>
                <option value="cash">Готівка</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
    </form>
</div>
{% endblock %}
