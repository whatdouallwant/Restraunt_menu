{% extends 'base.html' %}

{% block content %}

<div class="container main_background">
  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" 
  style="width: 1300px; margin: auto; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; padding: 10px;">
    <div class="container-fluid">
      <a class="navbar-brand">Sol-sol!</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'cart' %}">Cart</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'register' %}">Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 1500px; background-color: rgb(0, 179, 255); padding: 20px; border-radius: 10px; margin-top: 80px;">
    <div class="row mt-4" style="padding: 20px;">
      {% for dish in dishes %}
          <div class="card mb-3" style="max-width: 540px;">
          <div class="row g-0">
              <div class="col-md-4">
              <img src="{{ dish.image.url }}" class="img-fluid rounded-start" alt="{{ dish.name }}">
              </div>
              <div class="col-md-8">
              <div class="card-body">
                  <h5 class="card-title">{{ dish.name }}</h5>
                  <p class="card-text">{{ dish.description }}</p>
                  <p class="card-text">{{ dish.price }} ГРН / {{ dish.simelions }} §</p>
                  <a href="" class="my-btn">Додати до кошика</a>
                  <a href="{% url 'dish_detail' dish.id %}" class="btn btn-secondary">Детальніше</a>
              </div>
              </div>
          </div>
          </div>
          
      {% endfor %}
    </div>
  </div>
</div>









{% endblock %}
