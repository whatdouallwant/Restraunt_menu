{% extends 'base.html' %}

{% block content %}

<div class="container main_background">

  <div class="container mt-4" >
    <form method="get" action="{% url 'filter_by_category' category='all' %}" class="d-flex flex-column align-items-center fixed-top"
    style="margin-top: 40px; padding: 20px; border-radius:10px;">
      <div class="btn-group" role="group" aria-label="Basic example">
        <a href="{% url 'home' %}" class="btn btn-secondary my-btn">Всі</a>
        <a href="{% url 'filter_by_category' category='salad' %}" class="btn btn-secondary my-btn">Салати</a>
        <a href="{% url 'filter_by_category' category='main_course' %}" class="btn btn-secondary my-btn">Основні страви</a>
        <a href="{% url 'filter_by_category' category='dessert' %}" class="btn btn-secondary my-btn">Десерти</a>
        <a href="{% url 'filter_by_category' category='beverage' %}" class="btn btn-secondary my-btn">Напої</a>
        <a href="{% url 'filter_by_category' category='soup' %}" class="btn btn-secondary my-btn">Супи</a>
      </div>
    </form>
    <div class="row mt-4" style="padding: 40px;">
      {% for dish in dishes %}
          <div class="card mb-3" style="max-width: 540px;">
          <div class="row g-0">
              <div class="col-md-4">
              <img src="{{ dish.image.url }}" class="img-fluid rounded-start" alt="{{ dish.name }}">
              </div>
              <div class="col-md-8">
              <div class="card-body">
                  <h5 class="card-title">{{ dish.name }}</h5>
                  <p class="card-text">{{ dish.description }}</p>
                  <p class="card-text">{{ dish.price }} ГРН / {{ dish.simelions }} §</p>
                  <a href="{% url 'add_to_cart' dish.id %}" class="my-btn">Додати до кошика</a>
                  <a href="{% url 'dish_detail' dish.id %}" class="btn btn-secondary">Детальніше</a>
              </div>
              </div>
          </div>
          </div>
          
      {% endfor %}
    </div>
  </div>
</div>









{% endblock %}
