{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" 
style="max-width: 500px; background-color: #f8f9fa; padding: 20px; border-radius: 10px; position: relative; margin-top: 1000px;">
    <h2>Увійти в профіль</h2>
    <form method="post">
        {% csrf_token %}
        {{form.as_div}}
        <button type="submit" class="btn btn-primary">Увійти</button>
        <a href="{% url 'register' %}" class="btn btn-link">Зареєструватися</a>
    </form>
</div>
{% endblock %}
